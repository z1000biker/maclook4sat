name: Publish experimental macOS builds to Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful macOS build workflow run ID
        required: true
        default: '43769376693'
      release_tag:
        description: Existing or new GitHub prerelease tag
        required: true
        default: 'v4.4.9-macos-compass-poc'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-macos-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Promote Intel and Apple Silicon artifacts to Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'z1000biker/maclook4sat'
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || '43769376693' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'v4.4.9-macos-compass-poc' }}
    steps:
      - name: Wait for successful Intel and Apple Silicon compilation
        shell: bash
        run: gh run watch "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Create an experimental prerelease when missing
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Look4Sat 4.4.9 - Optional Compass preview (Intel + Apple Silicon)" \
              --notes "Experimental macOS port with optional external Serial/TCP Compass. Sensor input is disabled by default. CSV/JSON data, offsets, declination and stale-data fallback are implemented. **UNTESTED ON REAL COMPASS HARDWARE AND MAC DEVICES.** The prior north-up-only release remains available separately."
          fi

      - name: Download successful Intel build artifact
        shell: bash
        run: |
          mkdir -p downloaded/intel
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Look4Sat-Mac-Intel --dir downloaded/intel

      - name: Download successful Apple Silicon build artifact
        shell: bash
        run: |
          mkdir -p downloaded/arm64
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Look4Sat-Mac-AppleSilicon --dir downloaded/arm64

      - name: Validate archives and prepare clearly labeled release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          intel_file="$(find downloaded/intel -maxdepth 2 -type f -name '*.zip' -print -quit)"
          arm64_file="$(find downloaded/arm64 -maxdepth 2 -type f -name '*.zip' -print -quit)"
          test -n "$intel_file"
          test -n "$arm64_file"
          unzip -tq "$intel_file"
          unzip -tq "$arm64_file"
          cp "$intel_file" publish/Look4Sat-Mac-4.4.9-Compass-Intel-CI-UNTESTED.zip
          cp "$arm64_file" publish/Look4Sat-Mac-4.4.9-Compass-AppleSilicon-CI-UNTESTED.zip
          sha256sum publish/*.zip

      - name: Upload Compass builds to GitHub prerelease
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" publish/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'Look4Sat-Mac-4.4.9-Compass-Intel-CI-UNTESTED.zip'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'Look4Sat-Mac-4.4.9-Compass-AppleSilicon-CI-UNTESTED.zip'

      - name: Add conspicuous untested warning to release notes
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > release-notes.md
          if ! grep -Fq 'Experimental Compass builds - 16 November 2026' release-notes.md; then
            {
              printf '\n\n## Experimental CI builds - 15 November 2026\n\n'
              printf '%s\n' '- Added **Intel x86_64** and **Apple Silicon ARM64** Compass-preview app ZIP archives, built by GitHub Actions from the updated source.'
              printf '%s\n' '- **UNTESTED ON REAL MAC OR COMPASS HARDWARE.** Both new builds remain experimental. The optional external Compass (Serial/TCP CSV/JSON, calibration, radar rotation and stale-data fallback) has not been hardware-validated.'
              printf '%s\n' '- Successful compilation, offline checks and ad-hoc signing do **not** establish real-world runtime correctness, device compatibility, or accurate satellite tracking.'
              printf '%s\n' '- The previous north-up-only release is kept separately. The optional Compass is disabled by default.'
              printf '\n'
            } >> release-notes.md
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          fi
